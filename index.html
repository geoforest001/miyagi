<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>宮城県森林計画図</title>
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css?v=2" />
  </head>
  <body>
    <main class="page">
      <section class="map-card">
        <div id="map" aria-label="地図"></div>
      </section>
    </main>

    <!-- 読み込みインジケーター -->
    <div id="loadingIndicator">
      <div id="loadingInner">
        <div id="loadingSpinner"></div>
        <div id="loadingText">データ読み込み中...</div>
      </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast"></div>

    <!-- Excel連携: ファイル入力（非表示） -->
    <input id="xlsxInput" type="file" accept=".xlsx,.xls,.csv" style="display:none" />

    <!-- Excel連携モーダル -->
    <div id="xlsxModal">
      <div id="xlsxModalBox">
        <div id="xlsxModalTitle">📊 Excel / CSV 連携</div>
        <div id="xlsxModalInfo"></div>
        <div class="xlsxRow">
          <label class="xlsxLabel">対象レイヤ</label>
          <select id="xlsxLayerSel"></select>
        </div>
        <div class="xlsxRow">
          <label class="xlsxLabel">レイヤ側キー列</label>
          <select id="xlsxKeyGeo"></select>
        </div>
        <div class="xlsxRow">
          <label class="xlsxLabel">Excel側キー列</label>
          <select id="xlsxKeyXls"></select>
        </div>
        <div class="xlsxRow" id="xlsxColorRow">
          <label class="xlsxLabel">色分け列（PMTiles のみ）</label>
          <select id="xlsxColorCol"><option value="">── 色分けなし ──</option></select>
        </div>
        <div class="xlsxBtns">
          <button id="xlsxModalCancel">キャンセル</button>
          <button id="xlsxModalOk" class="xlsxOk">連携する</button>
        </div>
      </div>
    </div>

    <!-- Excel連携: 統計カード -->
    <div id="xlsxStatCard">
      <span id="xlsxStatText"></span>
      <button id="xlsxStatClose">解除</button>
    </div>

    <!-- Excel連携: 色分け凡例 -->
    <div id="xlsxLegend" style="display:none"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/protomaps-leaflet@5.1.0/dist/protomaps-leaflet.js" crossorigin=""></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="./main.js?v=3"></script>
    <script src="./weather.js?v=1"></script>
    <script src="./excel.js?v=1"></script>
  </body>
</html>
